name: Build Port Jars

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Upload Animation Director jar
        uses: actions/upload-artifact@v4
        with:
          name: animationdirector-1.20.1-1.3.1-port.1
          path: animationdirector/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeedsOfNature jar
        uses: actions/upload-artifact@v4
        with:
          name: needsofnature-1.20.1-1.3.1-port.1
          path: needsofnature/build/libs/*.jar
          if-no-files-found: error
